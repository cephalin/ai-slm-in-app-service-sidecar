<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fashion Store Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center">Fashion Store Assistant</h1>

    <form th:action="@{/send}" method="post" class="mt-4">
        <div class="mb-3">
            <label for="sltProduct" class="form-label">Select a product</label>
            <select id="sltProduct" name="selectedProduct" class="form-select">
                <option value="" disabled selected>Please select...</option>
                <option th:each="product : ${products}" th:value="${product.key}" th:text="${product.value}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="txtQuery" class="form-label">What would you like to know?</label>
            <textarea id="txtQuery" name="message" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send</button>
    </form>

    <div class="mt-4" th:if="${response}">
        <h5>Response:</h5>
        <p th:text="${response}"></p>
    </div>
</div>
</body>
</html>
